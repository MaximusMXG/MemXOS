name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: memex-linux-installer
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: memex-linux-installer/pyproject.toml

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openssl libegl1 libopengl0 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q

      - name: Validate storage plans against bundled Curtin schema
        run: python scripts/validate_curtin.py

      - name: Build .deb (no root, vendored Curtin)
        run: python packaging/build_deb.py --output /tmp/deb-out

      # scripts/verify_package.py is intentionally not run: it imports bundled
      # curtin, which needs python3-apt (aptsources), unavailable to the pip-based
      # setup-python interpreter.
